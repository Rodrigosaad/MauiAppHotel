name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workloads MAUI
      run: |
        dotnet workload install maui
        dotnet workload install maui-android

    - name: Localizar e Publicar Projeto APK
      run: |
        PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
        echo "A utilizar o projeto: $PROJECT_FILE"
        dotnet publish "$PROJECT_FILE" -f net8.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Guardar Artifact APK
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: '**/publish/*.apk'
