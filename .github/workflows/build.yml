name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar o .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workloads do .NET MAUI
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json || true

    - name: Compilar e Gerar APK
      run: dotnet publish MauiAppHotel.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk --ignore-failed-sources

    - name: Enviar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: bin/Release/net8.0-android/*/publish/*.apk
