name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workloads MAUI
      run: |
        dotnet workload install maui
        dotnet workload install maui-android

    - name: Publicar APK Android
      run: dotnet publish MauiAppHotel/MauiAppHotel.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Guardar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: MauiAppHotel/bin/Release/net8.0-android/*/publish/*.apk
