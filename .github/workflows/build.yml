name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Cargas de Trabalho MAUI
      run: |
        dotnet workload install maui
        dotnet workload install maui-android

    - name: Compilar Projeto APK
      run: dotnet publish -f net8.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Guardar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: '**/publish/*.apk'
