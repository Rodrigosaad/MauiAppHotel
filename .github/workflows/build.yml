name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workloads do MAUI
      run: |
        dotnet workload install maui
        dotnet workload install maui-android

    - name: Compilar APK
      run: |
        dotnet publish MauiAppHotel/MauiAppHotel.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Enviar Artifact APK
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: MauiAppHotel/bin/Release/net8.0-android/*/publish/*.apk
