name: Compilar APK .NET MAUI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar o .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Instalar Cargas de Trabalho MAUI
      run: |
        dotnet workload install maui
        dotnet workload install maui-android

    - name: Compilar Projeto e Gerar APK
      run: dotnet publish MauiAppHotel.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk

    - name: Enviar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: bin/Release/net8.0-android/*/publish/*.apk
