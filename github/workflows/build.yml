name: Compilar APK .NET MAUI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workload do MAUI
      run: dotnet workload install maui

    - name: Publicar o Aplicativo Android (APK)
      run: dotnet publish -f net8.0-android -c Release -p:AndroidKeyStore=false

    - name: Enviar o APK gerado como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-hotel-apk
        path: '**/*.apk'
